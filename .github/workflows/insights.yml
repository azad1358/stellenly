name: Job insights

# Embeds new jobs, finds similar jobs, compares salary / German / visa /
# experience with them and writes hints to jobs.insights (ingest/insights.py).
# Embeddings and the model are kept in the Actions cache, so only new jobs
# are embedded on each run.
on:
  # Right after every import, so new jobs get skills, comparisons and similar jobs within minutes.
  # (The LLM part stops by itself once the free daily quota is used up.)
  workflow_run:
    workflows: ["Ingest jobs", "Migrate database"]
    types: [completed]
  schedule:
    - cron: "47 4 * * *"     # daily safety net
  workflow_dispatch: {}

permissions:
  contents: write            # commit ingest/llm_facts.json (checked LLM corrections)

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  insights:
    # Also after an import that ended with a source alert: the other sources' jobs were still saved.
    if: github.event_name != 'workflow_run' || contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 100   # ~300 AI analyses at the free tier pace (public repo: Actions minutes are free)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements-insights.txt
      - run: pip install -r ingest/requirements-insights.txt
      - uses: actions/cache@v4
        with:
          path: ingest/.cache
          key: insights-${{ github.run_id }}
          restore-keys: insights-
      - name: Compute and store insights
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}       # optional (e.g. a free Groq or Gemini key)
          LLM_API_URL: ${{ vars.LLM_API_URL }}          # optional, OpenAI-compatible endpoint (default: Groq)
          LLM_MODEL: ${{ vars.LLM_MODEL }}              # e.g. gemini-2.5-flash
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}  # used when LLM_MODEL is overloaded or out of quota
          LLM_MAX_JOBS: ${{ vars.LLM_MAX_JOBS || 300 }}   # AI analyses per run; new jobs wait for the next run
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python ingest/insights.py
      - name: Commit checked LLM facts
        if: always()
        # Another run may have saved the file meanwhile: start from the latest main and merge our
        # facts into it (ours win per job) instead of a text merge that can conflict. Retries 3x.
        run: |
          [ -f ingest/llm_facts.json ] || exit 0
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          cp ingest/llm_facts.json "$RUNNER_TEMP/ours.json"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python ingest/llm_facts.py --merge "$RUNNER_TEMP/ours.json"
            git add ingest/llm_facts.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Update checked LLM facts"
            git push -q && exit 0
            sleep 5
          done
          exit 1
