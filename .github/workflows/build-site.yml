name: Build site pages

# Rebuilds the blog, weekly job-market report, city/tag landing pages,
# resources page and sitemap from live data, then commits them.
# Cloudflare Pages / GitHub Pages redeploys automatically on the new commit.
on:
  schedule:
    - cron: "37 5 * * *"     # daily 05:37 UTC, after the night's ingest runs
  push:
    branches: [main]
    paths: ["content/**", "build/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r build/requirements.txt
      - name: Build pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build/build_site.py
      - name: Commit generated pages
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add web content/reports
          git diff --cached --quiet || git commit -m "Daily site rebuild $(date -u +%F)"
          git push
