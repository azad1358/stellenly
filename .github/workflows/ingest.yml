name: Ingest jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      deactivate_max_share:
        description: "Max share of a source's jobs that may be hidden as 'no longer listed' in one run (0.6 = 60%)"
        default: "0.6"

permissions:
  contents: write            # commit the geocoding cache

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - run: python -m pytest -q ingest
      - name: Fetch, enrich and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEACTIVATE_MAX_SHARE: ${{ inputs.deactivate_max_share || '0.6' }}
        run: python ingest/ingest.py
      - name: Commit geocoding cache and discovered boards
        if: always()
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add ingest/geocache.json
          [ -f ingest/ats_boards.json ] && git add ingest/ats_boards.json
          git diff --cached --quiet && exit 0
          git commit -m "Update geocoding cache and discovered boards"
          git pull --rebase && git push
