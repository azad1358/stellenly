name: Ingest jobs

# WHAT: the start of the data pipeline (ingest/ingest.py). Runs the tests, downloads jobs from every source
#   (job APIs, company career pages), filters and cleans them (English only, Germany, agency check, salary,
#   German level), saves them to Supabase and hides jobs that are no longer listed or that REPORT_THRESHOLD+
#   visitors reported closed (repository variable, default 3). Commits the geocoding cache.
#
# WHEN (no other workflow calls this one):
#   - every 6 hours (GitHub's timer is best-effort: runs often start hours late, or not at all)
#   - a backup 3 hours after each slot: it runs only if no import succeeded in the last 4 hours, and otherwise
#     cancels itself (a cancelled run doesn't start "Job insights")
#   - the "Run workflow" button
# AFTER IT: "Job insights" starts by itself, and "Deploy website" after it.
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC)
    - cron: "47 3-23/6 * * *"  # backup: 03:47, 09:47, 15:47, 21:47 (see the first step)
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      deactivate_max_share:
        description: "Max share of a source's jobs that may be hidden as 'no longer listed' in one run (0.6 = 60%)"
        default: "0.6"
      amazon:
        description: "Also fetch Amazon's jobs now (normally only the first run after midnight UTC)"
        type: boolean
        default: false

permissions:
  contents: write            # commit the geocoding cache
  actions: write             # the backup run looks at earlier runs and may cancel itself

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Backup run - skip if a recent import succeeded
        if: github.event.schedule == '47 3-23/6 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ingest.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt')
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "Last successful import: ${last:-none} ($((age / 3600)) h ago)"
          if [ "$age" -lt 14400 ]; then
            echo "Recent enough: cancelling this backup run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
            sleep 60   # wait for the cancel to stop this job
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch, enrich and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEACTIVATE_MAX_SHARE: ${{ inputs.deactivate_max_share || '0.6' }}
          AMAZON: ${{ inputs.amazon && '1' || '' }}             # "1" = fetch Amazon in this run too
          REPORT_THRESHOLD: ${{ vars.REPORT_THRESHOLD || '3' }}   # repository variable: visitor reports that hide a job
        run: python ingest/ingest.py
      - name: Commit geocoding cache and discovered boards
        if: always()
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/cache/geocache.json
          [ -f data/cache/discovered_boards.json ] && git add data/cache/discovered_boards.json
          git diff --cached --quiet && exit 0
          git commit -m "Update geocoding cache and discovered boards"
          git pull --rebase && git push
