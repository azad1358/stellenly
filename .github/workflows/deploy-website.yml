name: Deploy website

# WHAT: builds every page of www.stellenly.com from the live database and publishes web/ to GitHub Pages.
#   1. build/news_collect.py: news for the News page (English feeds + Bundesagentur für Arbeit, translated by the
#      LLM) into content/news.json
#   2. build/build_site.py: blog, weekly job-market report, city/field pages, company pages, News page, Skill check
#      data, sitemap, RSS
#   3. build/job_pages.py: one page per job (schema.org JobPosting for Google's job search)
#   4. publish to GitHub Pages, ping search engines (IndexNow, Google Indexing API), post new jobs to the Telegram channel
#   5. post the code changes since the last post to the Discord #changelog channel (build/discord_post.py;
#      only real changes, not the bot's data updates)
# Generated pages are NOT committed; they are rebuilt on every deploy. Only the files a build cannot recreate are
# committed: content/reports/history.json (week-over-week numbers), content/news.json (translated news), the frozen pages of past weekly reports
# (web/blog/job-market-*.html) and downloaded company logos (web/logos/).
#
# WHEN (no other workflow calls this one; it starts itself on any of these):
#   - "Job insights" finished   -> new jobs online with skills, hints and similar jobs ("Job insights" runs
#     after every "Ingest jobs"; deploying after both doubled the Supabase egress, so only this one deploys)
#   - "Deploy backend" finished -> pages that need a new database function (a push that changes both
#     build/ and supabase/ starts both workflows at once; this run is the one that sees the new database)
#   - a push to main that changes web/, content/ (guides) or build/ (page code)
#   - the "Run workflow" button
on:
  push:
    branches: [main]
    paths: ["web/**", "content/**", "build/**"]
  workflow_run:
    workflows: ["Job insights", "Deploy backend"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write          # commit the report history and logos
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A run that ended with an alert (e.g. one dead job source) has still saved everything else.
    if: >-
      github.event_name != 'workflow_run' ||
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      SKILL_CHECK: ${{ vars.SKILL_CHECK }}   # repository variable; "1" = Skill check page on (off while it's redesigned)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0       # full history: the Discord changelog lists the commits since its last post
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r build/requirements.txt
      - name: Coats of arms for new states and cities (Wikidata / Wikimedia Commons, cached in data/cache)
        continue-on-error: true    # a missing one only shows a neutral icon
        run: python build/coats_of_arms.py
      - name: News page data (English feeds + Bundesagentur für Arbeit, translated to English)
        continue-on-error: true    # news never stops a deploy; a failed source or translation is retried next time
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}       # the same model as "Job insights"
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
        run: python build/news_collect.py
      - name: Site pages (guides, report, state/city/field and company pages, sitemap)
        run: python build/build_site.py
      - name: Skill check off -> drop its links from the hand-written pages too
        if: env.SKILL_CHECK != '1'
        run: sed -i 's#<a href="skill-check.html">Skill check</a>##g' web/*.html
      - name: Commit what the next build needs (report history, past reports, logos, coats of arms)
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add content/reports web/logos web/blog/job-market-*.html data/cache/coats_of_arms.json web/img/coa
          [ -f content/news.json ] && git add content/news.json
          git diff --cached --quiet && exit 0
          git commit -m "Report history, news and logos $(date -u +%F)"
          # "Ingest jobs" and "Job insights" also push to main: rebase on top of them and retry.
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main
          done
          exit 1
      - uses: actions/cache/restore@v4   # job texts of the last build: only changed ones are downloaded
        with:
          path: build/.job_pages_cache.json
          key: job-pages-${{ github.run_id }}
          restore-keys: job-pages-
      - name: Job pages (schema.org JobPosting for Google's job search)
        run: python build/job_pages.py
      - uses: actions/cache/save@v4
        with:
          path: build/.job_pages_cache.json
          key: job-pages-${{ github.run_id }}
      - name: Impressum off (repository variable IMPRESSUM = "1" turns it on) -> drop the page and every link to it
        if: vars.IMPRESSUM != '1'
        run: |
          rm -f web/impressum.html
          find web -name '*.html' -print0 | xargs -0 sed -i -E 's#<a href="(\.\./)*impressum\.html">Impressum</a>##g'
      - name: Version the CSS/JS links, so browsers load the new files right after a deploy
        run: |
          v="${GITHUB_SHA::8}"
          find web -name '*.html' -print0 | xargs -0 sed -i -E \
            "s#((href|src)=\"(\.\./)*(css|js)/[a-z-]+\.(css|js))\"#\1?v=$v\"#g"
      - uses: actions/configure-pages@v5
      # Right after the upload, GitHub sometimes doesn't list the artifact yet ("No artifacts named ..."): wait and
      # try once more. One name per attempt, so a re-run doesn't find the first attempt's artifact too ("Multiple ...").
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Tell search engines about new job pages (IndexNow)
        continue-on-error: true
        run: python build/job_pages.py --indexnow
      - uses: actions/cache/restore@v4
        with:
          path: build/.google_indexing_state.json
          key: google-indexing-${{ github.run_id }}
          restore-keys: google-indexing-
      - name: Tell Google about new and closed job pages (Indexing API)
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}   # service account JSON, owner of stellenly.com
        run: python build/google_indexing.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('build/.google_indexing_state.json') != ''
        with:
          path: build/.google_indexing_state.json
          key: google-indexing-${{ github.run_id }}
      - uses: actions/cache/restore@v4
        with:
          path: build/.telegram_state.json
          key: telegram-state-${{ github.run_id }}
          restore-keys: telegram-state-
      - name: Post new jobs to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python build/telegram_post.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('build/.telegram_state.json') != ''
        with:
          path: build/.telegram_state.json
          key: telegram-state-${{ github.run_id }}
      - uses: actions/cache/restore@v4
        with:
          path: build/.discord_state.json
          key: discord-state-${{ github.run_id }}
          restore-keys: discord-state-
      - name: Post code changes to Discord #changelog
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python build/discord_post.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('build/.discord_state.json') != ''
        with:
          path: build/.discord_state.json
          key: discord-state-${{ github.run_id }}
