name: Deploy Supabase functions

# Deploys supabase/functions/* (the RSS feed for searches) whenever they change.
# Needs the same secrets as "Migrate database": SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy RSS feed (public, no login)
        run: supabase functions deploy rss --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Smoke test
        run: |
          sleep 5
          curl -sf "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/rss?q=python" | head -c 300
