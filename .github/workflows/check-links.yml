name: Check dead links

# WHAT: re-opens up to 800 original postings (least recently checked first) and hides jobs whose posting
#   was taken down (ingest/check_links.py), so visitors don't click into closed jobs.
#
# WHEN (no other workflow calls this one, and it calls none):
#   - daily, and the "Run workflow" button
#   Hidden jobs leave the site with the next "Deploy website" (after the next ingest).
on:
  schedule:
    - cron: "43 3 * * *"     # daily, 03:43 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt
      - name: Re-check original postings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest/check_links.py --limit 800
